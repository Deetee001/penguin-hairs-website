// ---- THREE.JS PARTICLE WAVE ----
(function(){
  var canvas=document.getElementById('ph-canvas');
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
  var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  camera.position.set(0,30,60);
  camera.lookAt(0,-10,0);
  var isMobile=window.innerWidth<768;
  var gridSize=isMobile?50:80; var spacing=3; var total=gridSize*gridSize;
  var geo=new THREE.BufferGeometry();
  var p=new Float32Array(total*3);
  var o=new Float32Array(total*3);
  var ki=0;
  for(var i=0;i<gridSize;i++) for(var j=0;j<gridSize;j++){
    var x=(i-gridSize/2)*spacing, z=(j-gridSize/2)*spacing;
    p[ki]=o[ki]=x; p[ki+1]=o[ki+1]=0; p[ki+2]=o[ki+2]=z; ki+=3;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  var dc=document.createElement('canvas'); dc.width=dc.height=64;
  var dctx=dc.getContext('2d');
  var gr=dctx.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.4,'rgba(255,255,255,0.6)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  dctx.fillStyle=gr; dctx.fillRect(0,0,64,64);
  var ptMat=new THREE.PointsMaterial({color:0xffffff,size:0.35,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,map:new THREE.CanvasTexture(dc),sizeAttenuation:true,depthWrite:false});
  var pts=new THREE.Points(geo,ptMat); scene.add(pts);
  var lg=new THREE.BufferGeometry(); var lp=[];
  for(var i2=0;i2<gridSize;i2++) for(var j2=0;j2<gridSize;j2++){
    var idx=(i2*gridSize+j2)*3;
    if(j2<gridSize-1){var r=(i2*gridSize+(j2+1))*3; lp.push(p[idx],p[idx+1],p[idx+2],p[r],p[r+1],p[r+2]);}
    if(i2<gridSize-1){var b=((i2+1)*gridSize+j2)*3; lp.push(p[idx],p[idx+1],p[idx+2],p[b],p[b+1],p[b+2]);}
  }
  lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  var lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x88ccff,transparent:true,opacity:0.08,blending:THREE.AdditiveBlending}));
  scene.add(lines);
  var t=0;
  function animate(){
    requestAnimationFrame(animate); t+=0.008;
    var pa=pts.geometry.attributes.position.array;
    var la=lines.geometry.attributes.position.array;
    var pi=0;
    for(var ii=0;ii<gridSize;ii++) for(var jj=0;jj<gridSize;jj++){
      var ox=o[pi], oz=o[pi+2];
      var d=Math.sqrt(ox*ox+oz*oz);
      pa[pi+1]=Math.sin(ox*0.15+t)*8+Math.sin(oz*0.15+t*1.2)*6+Math.cos((ox+oz)*0.1+t*0.8)*4+Math.sin(d*0.1-t*2)*5;
      pi+=3;
    }
    var li=0;
    for(var ii2=0;ii2<gridSize;ii2++) for(var jj2=0;jj2<gridSize;jj2++){
      var idx2=(ii2*gridSize+jj2)*3;
      if(jj2<gridSize-1){var r2=(ii2*gridSize+(jj2+1))*3; la[li]=pa[idx2];la[li+1]=pa[idx2+1];la[li+2]=pa[idx2+2];la[li+3]=pa[r2];la[li+4]=pa[r2+1];la[li+5]=pa[r2+2]; li+=6;}
      if(ii2<gridSize-1){var b2=((ii2+1)*gridSize+jj2)*3; la[li]=pa[idx2];la[li+1]=pa[idx2+1];la[li+2]=pa[idx2+2];la[li+3]=pa[b2];la[li+4]=pa[b2+1];la[li+5]=pa[b2+2]; li+=6;}
    }
    pts.geometry.attributes.position.needsUpdate=true;
    lines.geometry.attributes.position.needsUpdate=true;
    pts.rotation.y=t*0.05; lines.rotation.y=t*0.05;
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
})();

// ---- STATUS CONFIG ----
var STATUS_CLASSES = {
  pending:    'ph-status-pending',
  processing: 'ph-status-processing',
  shipped:    'ph-status-shipped',
  delivered:  'ph-status-delivered',
  cancelled:  'ph-status-cancelled'
};
var STATUS_LABELS = {
  pending:    'Pending',
  processing: 'Processing',
  shipped:    'Shipped',
  delivered:  'Delivered',
  cancelled:  'Cancelled'
};

// ---- ORDER TRACKING ----
window.trackOrder = function(){
  var ref = (document.getElementById('ph-ref-input').value || '').trim().toUpperCase();
  var result = document.getElementById('ph-result');
  var btn = document.getElementById('ph-track-btn');
  if(!ref){
    result.innerHTML = '<div class="ph-track-msg error"><i class="fas fa-exclamation-circle"></i><p>Please enter an order reference.</p></div>';
    return;
  }
  result.innerHTML = '<div class="ph-track-msg"><div class="ph-spin"></div><p>Looking up your order...</p></div>';
  btn.disabled = true;

  // Search by last 8 chars of square_order_id (ilike) or full order ref
  var query = SB_URL + '/rest/v1/orders?or=(square_order_id.ilike.*' + encodeURIComponent(ref) + ',square_payment_id.ilike.*' + encodeURIComponent(ref) + ')&select=*&limit=5';

  fetch(query, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  })
  .then(function(r){ return r.json(); })
  .then(function(orders){
    btn.disabled = false;
    if(!Array.isArray(orders) || orders.length === 0){
      result.innerHTML = '<div class="ph-track-msg error"><i class="fas fa-search"></i><p>No order found for <strong style="color:rgba(255,255,255,0.6);">' + ref + '</strong>.<br><br>Please double-check your reference number.<br>It appears in your confirmation email as the last 8 characters.</p></div>';
      return;
    }
    result.innerHTML = orders.map(function(order){ return renderOrder(order); }).join('');
  })
  .catch(function(){
    btn.disabled = false;
    result.innerHTML = '<div class="ph-track-msg error"><i class="fas fa-exclamation-triangle"></i><p>Could not look up your order. Please try again.</p></div>';
  });
};

function renderOrder(order){
  var ref8 = order.square_order_id ? order.square_order_id.slice(-8).toUpperCase() : (order.id || '');
  var date = order.created_at ? new Date(order.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : '';
  var status = (order.status || 'pending').toLowerCase();
  var statusClass = STATUS_CLASSES[status] || 'ph-status-pending';
  var statusLabel = STATUS_LABELS[status] || status;

  // Items
  var items = [];
  try { items = Array.isArray(order.items) ? order.items : JSON.parse(order.items || '[]'); } catch(e){}
  var itemsHtml = '';
  if(items.length > 0){
    itemsHtml = '<div class="ph-order-section-title" style="margin-top:1.25rem;">Items Ordered</div>';
    itemsHtml += items.map(function(item){
      return '<div class="ph-order-item">'
        + '<div><div class="ph-order-item-name">' + (item.name || 'Item') + (item.qty > 1 ? ' &times;' + item.qty : '') + '</div>'
        + (item.specs ? '<div class="ph-order-item-specs">' + item.specs + '</div>' : '') + '</div>'
        + '<div class="ph-order-item-price">$' + ((item.price || 0) * (item.qty || 1)).toFixed(2) + '</div>'
        + '</div>';
    }).join('');
  }

  // Totals
  var subtotal = order.subtotal != null ? parseFloat(order.subtotal) : null;
  var shipping = order.shipping_cost != null ? parseFloat(order.shipping_cost) : null;
  var total = order.total != null ? parseFloat(order.total) : null;
  var totalsHtml = '';
  if(subtotal != null || total != null){
    totalsHtml = '<div class="ph-order-totals">';
    if(subtotal != null) totalsHtml += '<div class="ph-order-total-row"><span>Subtotal</span><span>$' + subtotal.toFixed(2) + '</span></div>';
    if(shipping != null) totalsHtml += '<div class="ph-order-total-row"><span>Shipping</span><span>$' + shipping.toFixed(2) + '</span></div>';
    if(total != null) totalsHtml += '<div class="ph-order-total-row grand"><span>Total</span><span>$' + total.toFixed(2) + ' CAD</span></div>';
    totalsHtml += '</div>';
  }

  // Customer
  var customerHtml = '';
  if(order.customer_name){
    customerHtml = '<div class="ph-customer-info">'
      + '<div class="ph-order-section-title">Customer</div>'
      + '<div style="font-size:0.85rem;color:rgba(255,255,255,0.6);">' + order.customer_name + '</div>'
      + (order.customer_email ? '<div style="font-size:0.78rem;color:rgba(255,255,255,0.35);margin-top:0.2rem;">' + order.customer_email + '</div>' : '')
      + '</div>';
  }

  return '<div class="ph-order-card">'
    + '<div class="ph-order-card-header">'
    + '<div>'
    + '<div class="ph-order-ref">Order #' + ref8 + '</div>'
    + (date ? '<div class="ph-order-date">' + date + '</div>' : '')
    + '</div>'
    + '<span class="ph-status-badge ' + statusClass + '">' + statusLabel + '</span>'
    + '</div>'
    + '<div class="ph-order-body">'
    + itemsHtml
    + totalsHtml
    + customerHtml
    + '</div>'
    + '</div>';
}

// ---- URL PARAM AUTO-SEARCH ----
(function(){
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref');
  if(ref){
    var input = document.getElementById('ph-ref-input');
    if(input){ input.value = ref.toUpperCase(); trackOrder(); }
  }
})();

// ---- SCROLL PROGRESS ----
(function(){
  var overlay = document.getElementById('ph-overlay');
  overlay.addEventListener('scroll', function(){
    document.getElementById('ph-nav').classList.toggle('scrolled', overlay.scrollTop > 80);
  });
})();

// Navigate parent Squarespace window for internal links
document.querySelectorAll('a[target="_parent"]').forEach(function(link){
  link.addEventListener('click', function(e){
    e.preventDefault();
    var href = 'https://www.penguinhairs.com' + this.getAttribute('href');
    try { window.top.location.href = href; }
    catch(err) { window.parent.location.href = href; }
  });
});
</script>
